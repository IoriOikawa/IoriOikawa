<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 900 110'
    style='background-color: #00000000;'
    width='900px' height='110px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                    <path id='path0'>
                            <!-- Grouped lines: lines within a group type sequentially, all clear together -->
                                <animate id='d0' attributeName='d'
                    begin='0s;d2.end'
                    dur='12400ms'
                    fill='remove'
                    values='m0,27 h0 ; m0,27 h0 ; m0,27 h900 ; m0,27 h900 ; m0,27 h0'
                    keyTimes='0;0;0.18064516129032;0.95483870967742;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#A9D5E2' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Good evening, welcome!
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Grouped lines: lines within a group type sequentially, all clear together -->
                                <animate id='d1' attributeName='d'
                    begin='0s;d2.end'
                    dur='12400ms'
                    fill='remove'
                    values='m0,54 h0 ; m0,54 h0 ; m0,54 h900 ; m0,54 h900 ; m0,54 h0'
                    keyTimes='0;0.2258064516129;0.40645161290323;0.95483870967742;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#A9D5E2' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            As a hacker, a professor, a musician, a kigu...
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Grouped lines: lines within a group type sequentially, all clear together -->
                                <animate id='d2' attributeName='d'
                    begin='0s;d2.end'
                    dur='12400ms'
                    fill='remove'
                    values='m0,81 h0 ; m0,81 h0 ; m0,81 h900 ; m0,81 h900 ; m0,81 h0'
                    keyTimes='0;0.45161290322581;0.63225806451613;0.95483870967742;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#A9D5E2' font-size='22'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            Is there anything I can do to make you code better?
        </textPath>
    </text>
</svg>
