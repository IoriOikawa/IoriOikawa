name: Update profile banner

on:
  schedule:
    # Start three minutes after each New York scene boundary, with two retries.
    - cron: '3,13,23 6,12,17,21 * * *'
      timezone: 'America/New_York'
    # Recover a missed boundary update without checking every half hour all day.
    - cron: '37 * * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
  push:
    paths:
      - 'README.md'
      - 'asset_input/*.gif'
      - 'scripts/update_banner.py'
      - 'tests/**'
      - '.github/workflows/update-banner.yml'

permissions:
  contents: write

concurrency:
  group: profile-banner
  cancel-in-progress: false

jobs:
  update-banner:
    # Manual runs and pushes from other branches must not update the profile.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the latest default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Test synchronized banner and greeting updates
        run: python3 -m unittest discover -s tests -v

      - name: Select the current scene and greeting
        run: python3 scripts/update_banner.py

      - name: Commit only a changed banner
        run: |
          if git diff --quiet -- README.md; then
            echo "The current scene is already displayed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m "chore: update profile banner"
          git push
