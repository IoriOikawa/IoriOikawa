<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoundCanvas — banner artwork</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { width: max-content; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    .banner { position: relative; overflow: hidden; isolation: isolate; border-radius: 26px; }
    .banner::after { content: ""; position: absolute; inset: 0; border: 2px solid #ccd0e0; border-radius: inherit; pointer-events: none; }
    .desktop { width: 1200px; height: 400px; }
    .desktop img { display: block; width: 100%; height: 100%; }
    .mobile {
      width: 750px; height: 450px; display: grid; align-items: center;
      grid-template-columns: 300px minmax(0, 1fr); gap: 14px; padding: 24px 28px 24px 20px;
      color: #536178; background: linear-gradient(110deg, #fffaf5, #faf6f2 65%, #edf0f3);
    }
    .mobile::before { content: ""; position: absolute; z-index: -1; width: 330px; height: 330px; right: -175px; bottom: -230px; transform: rotate(45deg); border: 2px solid #d0d8e2; background: #dee7ec80; }
    .artwork { position: relative; height: 402px; }
    .artwork img { position: absolute; left: -20px; bottom: -24px; width: 330px; height: 450px; object-fit: contain; object-position: center bottom; }
    .copy { min-width: 0; position: relative; }
    h1 { margin: 0 0 16px; color: #303445; font: bold 46px/1.18 Georgia, "Times New Roman", serif; letter-spacing: -0.8px; white-space: nowrap; }
    .description { margin: 0; font-size: 38px; font-weight: 500; line-height: 1.48; }
    .tags { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .tag { padding: 6px 12px; border: 1.5px solid #c4dcd7; border-radius: 999px; color: #4d9290; background: #edf4ef; font-size: 25px; line-height: 1.3; white-space: nowrap; }
    .audio { color: #a1743e; border-color: #e8d3b8; background: #fbf1e4; }
    .p5 { color: #536d92; border-color: #ccd5e7; background: #e9edf5; }
    .action { margin: 18px 0 0; color: #94703d; font-size: 32px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
    .action span { margin-left: 16px; }
    .banner[hidden] { display: none; }
  </style>
</head>
<body>
  <section class="banner desktop" id="desktop" aria-label="SoundCanvas desktop banner">
    <img src="../../../asset_input/soundcanvas-project-banner-original.png" alt="SoundCanvas: Turn music into a world you can enter. WebGL, Audio Reactive, p5.js. View project.">
  </section>
  <section class="banner mobile" id="mobile" aria-label="SoundCanvas mobile banner">
    <div class="artwork"><img src="../../../asset_input/soundcanvas-illustration-transparent.png" alt="Headphone-wearing character holding a glowing musical globe with a rabbit inside"></div>
    <div class="copy">
      <h1>SoundCanvas</h1>
      <p class="description">Turn music into a world you can enter.</p>
      <div class="tags"><span class="tag">WebGL</span><span class="tag audio">Audio Reactive</span><span class="tag p5">p5.js</span></div>
      <p class="action">View project<span>→</span></p>
    </div>
  </section>
  <script>
    const selected = new URLSearchParams(location.search).get('layout');
    if (selected === 'desktop' || selected === 'mobile') {
      document.querySelectorAll('.banner').forEach(banner => { banner.hidden = banner.id !== selected; });
    }
  </script>
</body>
</html>
