<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TLDrRacket — banner artwork</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { width: max-content; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif; }
    .banner {
      position: relative;
      display: grid;
      align-items: center;
      overflow: hidden;
      isolation: isolate;
      border: 2px solid #ccd0e0;
      border-radius: 26px;
      color: #3d425f;
      background: linear-gradient(105deg, #fff 0%, #fff 35%, #f7f8fc 61%, #fcf8ed 100%);
    }
    .desktop { width: 1200px; height: 400px; grid-template-columns: 370px minmax(0, 1fr); gap: 30px; padding: 24px 48px 24px 20px; }
    .mobile { width: 750px; height: 450px; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; padding: 24px 28px 24px 20px; background: linear-gradient(105deg, #fff 0%, #fff 44%, #f7f8fc 68%, #fcf8ed 100%); }
    .banner::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 360px;
      height: 360px;
      right: -150px;
      bottom: -245px;
      transform: rotate(45deg);
      border: 2px solid #d4d9eb;
      background: linear-gradient(135deg, #dbe2f2a0, #f4e5c585 54%, #dfdef085);
    }
    .logo { display: flex; justify-content: center; align-items: center; }
    .logo img { display: block; width: 350px; height: 350px; object-fit: contain; }
    .mobile .logo img { width: 300px; height: 300px; }
    .copy { min-width: 0; position: relative; }
    .eyebrow { margin: 0 0 12px; color: #737c95; font-size: 22px; font-weight: 500; letter-spacing: 3px; }
    h1 { margin: 0 0 16px; color: #41486e; font-family: Georgia, "Times New Roman", serif; font-weight: 700; font-size: 66px; line-height: 1.18; letter-spacing: -1.2px; white-space: nowrap; }
    .description { margin: 0; color: #5d647b; font-size: 38px; font-weight: 500; line-height: 1.5; letter-spacing: 1px; }
    .desktop .description { font-size: 32px; letter-spacing: 0; }
    .footer { margin-top: 22px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .status { display: inline-block; padding: 6px 18px; border: 1.5px solid #d6dbea; border-radius: 999px; background: #f2f4fa; color: #606c91; font-size: 24px; line-height: 1.3; white-space: nowrap; }
    .action { margin: 0; color: #8d6a36; font-size: 28px; font-weight: 600; white-space: nowrap; }
    .action span { display: inline-block; margin-left: 16px; }
    .mobile .eyebrow { display: none; }
    .mobile h1 { margin-bottom: 20px; font-size: 46px; letter-spacing: -0.8px; }
    .mobile .description { font-size: 38px; line-height: 1.6; letter-spacing: 0; }
    .mobile .footer { flex-direction: column; align-items: flex-start; gap: 18px; margin-top: 22px; }
    .mobile .status { font-size: 30px; padding: 7px 20px; }
    .mobile .action { font-size: 32px; }
    .banner[hidden] { display: none; }
  </style>
</head>
<body>
  <section class="banner desktop" id="desktop" aria-label="TLDrRacket desktop banner: An RAG reading companion for Racket learners.">
    <div class="logo"><img src="../../../asset_input/tldrracket_sicp.png" alt="TLDrRacket"></div>
    <div class="copy">
      <p class="eyebrow">PROGRAMMING LANGUAGES · RAG</p>
      <h1>TLDrRacket</h1>
      <p class="description">An RAG reading companion for Racket learners.</p>
      <div class="footer"><span class="status">CS4400 / CS5400</span><p class="action">View project<span>→</span></p></div>
    </div>
  </section>
  <section class="banner mobile" id="mobile" aria-label="TLDrRacket mobile banner: An RAG reading companion for Racket learners.">
    <div class="logo"><img src="../../../asset_input/tldrracket_sicp.png" alt="TLDrRacket"></div>
    <div class="copy">
      <p class="eyebrow">PROGRAMMING LANGUAGES · RAG</p>
      <h1>TLDrRacket</h1>
      <p class="description">An RAG reading companion for Racket learners.</p>
      <div class="footer"><span class="status">CS4400 / CS5400</span><p class="action">View project<span>→</span></p></div>
    </div>
  </section>
  <script>
    const selected = new URLSearchParams(location.search).get('layout');
    if (selected === 'desktop' || selected === 'mobile') {
      document.querySelectorAll('.banner').forEach(banner => { banner.hidden = banner.id !== selected; });
    }
  </script>
</body>
</html>
