<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nekoinfo — banner artwork</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body { width: max-content; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    .banner {
      position: relative; display: grid; align-items: center; overflow: hidden; isolation: isolate;
      border-radius: 26px; color: #5b6d65;
      background: linear-gradient(110deg, #fffdf6 0%, #fcfaf3 52%, #edf5ef 100%);
    }
    .banner::after { content: ""; position: absolute; inset: 0; border: 2px solid #cddbd5; border-radius: inherit; pointer-events: none; }
    .banner::before { content: ""; position: absolute; z-index: -1; width: 360px; height: 360px; right: -150px; bottom: -245px; transform: rotate(45deg); border: 2px solid #cddfd6; background: linear-gradient(135deg, #dceee5b0, #f3ead580); }
    .desktop { width: 1200px; height: 400px; grid-template-columns: 370px minmax(0, 1fr); gap: 30px; padding: 24px 48px 24px 20px; }
    .mobile { width: 750px; height: 450px; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; padding: 24px 28px 24px 20px; }
    .artwork { display: flex; align-items: center; justify-content: center; }
    .artwork img { display: block; width: 370px; height: 352px; object-fit: contain; }
    .mobile .artwork img { width: 330px; height: 390px; flex-shrink: 0; }
    .copy { min-width: 0; position: relative; }
    .eyebrow { margin: 0 0 10px; color: #71867a; font-size: 20px; font-weight: 500; letter-spacing: 3px; }
    h1 { margin: 0 0 16px; color: #36473f; font: bold 76px/1.12 Georgia, "Times New Roman", serif; letter-spacing: -1.2px; white-space: nowrap; }
    .description { margin: 0; font-size: 32px; font-weight: 500; line-height: 1.5; }
    .footer { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .tags { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .tag { display: inline-block; padding: 6px 14px; border: 1.5px solid #c6dcd0; border-radius: 999px; color: #56816b; background: #edf5ef; font-size: 24px; line-height: 1.3; white-space: nowrap; }
    .gtk { color: #607076; border-color: #d0dadd; background: #edf1f2; }
    .monitor { color: #96774d; border-color: #e3d7c1; background: #faf3e6; }
    .action { margin: 0; color: #937044; font-size: 28px; font-weight: 600; line-height: 1.3; white-space: nowrap; }
    .action span { margin-left: 16px; }
    .mobile .eyebrow { display: none; }
    .mobile h1 { font-size: 52px; letter-spacing: -0.8px; }
    .mobile .description { font-size: 38px; line-height: 1.5; }
    .mobile .footer { flex-direction: column; align-items: flex-start; gap: 18px; margin-top: 22px; }
    .mobile .tag { font-size: 25px; padding: 6px 12px; }
    .mobile .action { font-size: 32px; }
    .banner[hidden] { display: none; }
  </style>
</head>
<body>
  <section class="banner desktop" id="desktop" aria-label="nekoinfo desktop banner">
    <div class="artwork"><img src="../../../asset_input/nekoinfo-dr-ginger-kaomoji-transparent.png" alt="Cartoon Dr. Ginger resting in front of a computer displaying a cat kaomoji"></div>
    <div class="copy">
      <p class="eyebrow">LINUX · DESKTOP MONITOR</p>
      <h1>nekoinfo</h1>
      <p class="description">A native Linux monitor, with a little cat.</p>
      <div class="footer"><div class="tags"><span class="tag">Linux</span><span class="tag gtk">GTK4</span><span class="tag monitor">System Monitor</span></div><p class="action">View project<span>→</span></p></div>
    </div>
  </section>
  <section class="banner mobile" id="mobile" aria-label="nekoinfo mobile banner">
    <div class="artwork"><img src="../../../asset_input/nekoinfo-dr-ginger-kaomoji-transparent.png" alt="Cartoon Dr. Ginger resting in front of a computer displaying a cat kaomoji"></div>
    <div class="copy">
      <h1>nekoinfo</h1>
      <p class="description">A native Linux monitor, with a little cat.</p>
      <div class="footer"><div class="tags"><span class="tag">Linux</span><span class="tag gtk">GTK4</span><span class="tag monitor">System Monitor</span></div><p class="action">View project<span>→</span></p></div>
    </div>
  </section>
  <script>
    const selected = new URLSearchParams(location.search).get('layout');
    if (selected === 'desktop' || selected === 'mobile') {
      document.querySelectorAll('.banner').forEach(banner => { banner.hidden = banner.id !== selected; });
    }
  </script>
</body>
</html>
